[package]
name = "rewind"
version = "0.1.0"
edition = "2024"
description = "Local time machine for your project folder: every save and every AI edit, undoable."
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
zstd = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
